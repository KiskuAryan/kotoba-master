services:
  - type: web
    name: kotoba-master
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt && PYTHONPATH=backend python backend/app/seed.py"
    startCommand: "PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///kotoba.db
